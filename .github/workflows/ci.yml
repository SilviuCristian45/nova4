name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @replog/shared
        run: npm run build:shared

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit tests (shared, web, api, migration script)
        run: |
          npm run test:shared
          npm run test:web
          npm run test:api
          node --test scripts/migrate-from-supabase.test.mjs

      - name: Build @replog/api and @replog/web
        run: |
          npm run build:api
          npm run build:web

  e2e:
    name: API E2E Integration Tests (Postgres 17 + MinIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @replog/shared
        run: npm run build:shared

      - name: Start Postgres 17 + MinIO via docker-compose.dev.yml
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait postgres minio
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Run NestJS E2E test suites
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/replog
          JWT_ACCESS_SECRET: ci-e2e-jwt-secret-at-least-32-characters-long
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
        run: npm run test:api:e2e

      - name: Tear down E2E containers
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
