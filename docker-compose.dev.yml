# Local development backing services for RepLog (`npm run dev:api` + `npm run dev:web` or `npm run test:api:e2e`).
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down -v
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: replog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-postgres}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d replog"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${DEV_MINIO_PORT:-9000}:9000"
      - "${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${DEV_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_PASSWORD:-minioadmin}
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_postgres_data:
  dev_minio_data:
