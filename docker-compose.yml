# RepLog self-hosted stack (5 services, zero Supabase dependencies):
#   postgres (PostgreSQL 17) + minio (S3 object storage) + api (NestJS 11 + TypeORM + built-in cron)
#   + web (Next.js standalone) + caddy (automatic HTTPS single-domain reverse proxy).
#
# Quick start:
#   node scripts/gen-secrets.mjs      # prints the secrets
#   cp .env.example .env              # paste them in, set DOMAIN
#   docker compose up -d --build
x-public-url: &public-url ${PUBLIC_SCHEME:-https}://${DOMAIN:?set DOMAIN in .env}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: replog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d replog"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/replog
      TYPEORM_MIGRATIONS_RUN: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: *public-url
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      COACH_SELF_SERVE: ${COACH_SELF_SERVE:-true}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: *public-url
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKETS: "true"
      S3_BUCKET_PROGRESS_PHOTOS: progress-photos
      S3_BUCKET_CHECKIN_PHOTOS: checkin-photos
      USDA_API_KEY: ${USDA_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DRIVE_TOKEN_KEY: ${DRIVE_TOKEN_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DRIVE_CRON_ENABLED: ${DRIVE_CRON_ENABLED:-true}
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      COACH_SELF_SERVE: ${COACH_SELF_SERVE:-true}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: *public-url
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
